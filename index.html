    function lookupAndDecrypt() {
        const rawEmail = document.getElementById("emailInput").value.trim().toLowerCase();
        const resultBox = document.getElementById("result");

        resultBox.style.display = "none";
        resultBox.className = "result-box";

        if (!rawEmail) {
            resultBox.innerHTML = "Please enter an email address.";
            resultBox.classList.add("error");
            resultBox.style.display = "block";
            return;
        }

        // 1. Hash the user input to look up the object key row
        const hashedEmail = CryptoJS.SHA256(rawEmail).toString();

        if (database.hasOwnProperty(hashedEmail)) {
            const base64EncryptedPayload = database[hashedEmail];

            try {
                // 2. Format browser key matching the exact SHA256 key configuration compiled in R
                const key = CryptoJS.SHA256(rawEmail);
                const cipherParams = CryptoJS.lib.CipherParams.create({
                    ciphertext: CryptoJS.enc.Base64.parse(base64EncryptedPayload)
                });

                // 3. Decrypt on-the-fly using AES-CBC matching engine specs
                const decrypted = CryptoJS.AES.decrypt(cipherParams, key, {
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7,
                    iv: key 
                });

                const decryptedCode = decrypted.toString(CryptoJS.enc.Utf8);

                if (decryptedCode) {
                    resultBox.innerHTML = `Your registration details: <span class="code-display">${decryptedCode}</span>`;
                    resultBox.classList.add("success");
                } else {
                    throw new Error();
                }
            } catch (error) {
                resultBox.innerHTML = "Decryption protocol mismatch error.";
                resultBox.classList.add("error");
            }
        } else {
            resultBox.innerHTML = "No credentials found matching that email address.";
            resultBox.classList.add("error");
        }

        resultBox.style.display = "block";
    }

        if (e.key === "Enter") lookupAndDecrypt();
